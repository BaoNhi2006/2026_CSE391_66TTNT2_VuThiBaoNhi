<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Đăng ký tài khoản</title>
  </head>
  <body>
    <div class="form-wrapper">

      <!-- ===== THANH TIẾN TRÌNH ===== -->
      <div class="progress-bar">
        <div class="progress-step active" id="prog-1">
          <div class="progress-circle">1</div>
          <span>Cá nhân</span>
        </div>
        <div class="progress-line" id="line-1"></div>
        <div class="progress-step" id="prog-2">
          <div class="progress-circle">2</div>
          <span>Tài khoản</span>
        </div>
        <div class="progress-line" id="line-2"></div>
        <div class="progress-step" id="prog-3">
          <div class="progress-circle">3</div>
          <span>Xác nhận</span>
        </div>
      </div>

      <!-- ===== BƯỚC 1: Thông tin cá nhân ===== -->
      <div id="step1" class="step">
        <h2>Thông tin cá nhân</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="fullname">Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Nguyen Van A" maxlength="50" />
            <span id="counter">0/50</span>
            <span class="error-msg" id="error-fullname"></span>
          </div>
          <div class="form-group">
            <label for="dateOfBirth">Ngày sinh:</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" />
            <span class="error-msg" id="error-dateOfBirth"></span>
          </div>
          <div class="form-group">
            <label>Giới tính:</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="gender" value="Nam" />Nam</label>
              <label class="radio-label"><input type="radio" name="gender" value="Nữ" />Nữ</label>
              <label class="radio-label"><input type="radio" name="gender" value="Khác" />Khác</label>
            </div>
            <span class="error-msg" id="error-gender"></span>
          </div>
          <div class="btn-group">
            <span></span>
            <button type="button" id="next-btn-1" class="btn-next">Tiếp theo →</button>
          </div>
        </form>
      </div>

      <!-- ===== BƯỚC 2: Thông tin tài khoản ===== -->
      <div id="step2" class="step" style="display: none">
        <h2>Thông tin tài khoản</h2>
        <form id="accountForm">
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="example@gmail.com" />
            <span class="error-msg" id="error-email"></span>
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <div class="pw-wrap">
              <input type="password" id="password" name="password" placeholder="Nhập tối thiểu 8 kí tự!" />
              <button type="button" id="toggle">👁</button>
            </div>
            <span class="error-msg" id="error-password"></span>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" />
            <span class="error-msg" id="error-confirmPassword"></span>
          </div>
          <div class="btn-group">
            <button type="button" id="return-btn" class="btn-back">← Quay lại</button>
            <button type="button" id="next-btn-2" class="btn-next">Tiếp theo →</button>
          </div>
        </form>
      </div>

      <!-- ===== BƯỚC 3: Xác nhận thông tin ===== -->
      <div id="step3" class="step" style="display: none">
        <h2>Xác nhận thông tin</h2>
        <div class="summary">
          <div class="summary-row">
            <span class="summary-label">Họ và tên:</span>
            <span class="summary-value" id="summary-name"></span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Ngày sinh:</span>
            <span class="summary-value" id="summary-date"></span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Giới tính:</span>
            <span class="summary-value" id="summary-gender"></span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Email:</span>
            <span class="summary-value" id="summary-email"></span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Mật khẩu:</span>
            <span class="summary-value">••••••••</span>
          </div>
        </div>
        <div class="btn-group">
          <button type="button" id="back-btn-3" class="btn-back">← Quay lại</button>
          <button type="button" id="submit-btn" class="btn-next">Đăng ký ✓</button>
        </div>
      </div>
    </div>

    <!-- ===== THÔNG BÁO THÀNH CÔNG ===== -->
    <div id="successMessage" style="display: none"></div>
    
    <script src="main.js"></script>
  </body>
</html>
